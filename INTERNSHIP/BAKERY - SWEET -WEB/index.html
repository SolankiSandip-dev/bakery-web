<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAKERY LOGIN PAGE</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/fontawesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="main">
        <!-- Header Row: Left kone mein Logo + Bagal mein patli strip -->
        <div class="header-row">
            <img src="img/BLOGO.png" alt="Brother's Bakery Logo" class="corner-logo">
            
            <div class="topbar">
                LOGIN HERE
            </div>
        </div>

               
      <div class="main-container">

    <!-- Left Side Image -->
    <div class="left-image">
        <img src="img/1.png" alt="Bakery Image">
    </div>

    <!-- Right Side Login Form -->
    <div class="login-box">

        <h1>Welcome Back!</h1>
        <p>Login to Brother's Bakery</p>

        <form id="loginForm">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" class="llb">

            <label >Password</label>
            <input type="password" id="password" placeholder="Enter password" class="llb">
            <p id="error"></p>

            <button type="submit" class="ll">LOGIN</button>
        </form><br>

        <p>Don't have an account? Sign Up</p><br><hr><br>
        <div class="LOGOS">
               
                <i class="bi bi-google"  ></i>
                <i class="bi bi-apple"   ></i>
                <i class="bi bi-instagram"  ></i>
                
        </div>
        

    </div>

</div>
        


    </div>
<script src="login.js"></script>
</body>
</html>
